name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
  schedule:
    # Weekly sweep: contract drift is created by a printer-repo push,
    # which this repo's push-triggered CI never sees.
    - cron: '30 12 * * 4'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check contract-vectors drift
        run: node scripts/check-contract-drift.mjs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
